{{- if .Values.pool.enabled }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .Values.pool.name }}
  namespace: {{ .Release.Namespace }}
spec:
  autoAssign: true
  avoidBuggyIPs: true
  addresses:
{{- range .Values.pool.addresses }}
    - {{ . }}
{{- end }}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .Values.pool.name }}
  namespace: {{ .Release.Namespace }}
spec:
  ipAddressPools:
    - {{ .Values.pool.name }}
{{- end }}
