# Metrics Server (for kubectl top and k9s CPU/MEM stats)
metrics-server:
  enabled: true
  args:
    - --kubelet-insecure-tls
    - --kubelet-preferred-address-types=InternalIP

# Monitoring
victoria-metrics-k8s-stack:
  enabled: true

  # Disable
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  # Required for k3s: Allow scraping self-signed kubelet & cAdvisor certs
  kubelet:
    enabled: true
    serviceMonitor:
      kubelet:
        insecureSkipVerify: true
      cAdvisor:
        insecureSkipVerify: true
      probes:
        insecureSkipVerify: true

  # Alerting: vmalert evaluates VMRules (templates/alerts.yaml + chart defaults),
  # alertmanager routes them to Discord. The webhook URL comes from Bitwarden via
  # ESO (discord-secret / DISCORD_WEBHOOK) — never hardcode it here.
  alertmanager:
    enabled: true
    useManagedConfig: true
    spec:
      replicaCount: 1
      nodeSelector:
        kubernetes.io/hostname: ubuntu
    config:
      route:
        receiver: discord
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          # Meta-alerts (Watchdog, InfoInhibitor) and info-severity noise go nowhere.
          - matchers:
              - alertname =~ "Watchdog|InfoInhibitor"
            receiver: "null"
          - matchers:
              - severity = "info"
            receiver: "null"
      receivers:
        - name: "null"
        - name: discord
          discord_configs:
            - webhook_url_secret:
                name: discord-secret
                key: DISCORD_WEBHOOK
              send_resolved: true
              title: "{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}"
              message: "{{ range .Alerts }}**{{ .Annotations.summary }}**\n{{ .Annotations.description }}\n{{ end }}"
  vmalert:
    enabled: true
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu

  # Grafana
  grafana:
    enabled: true
    grafana.ini:
      auth.anonymous:
        enabled: true
        org_role: Admin
    ingress:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Grafana
        gethomepage.dev/group: Monitoring
        gethomepage.dev/description: Metrics and dashboards
        gethomepage.dev/ping: http://metrics.home/api/health
      hosts:
        - metrics.home

  prometheus-node-exporter:
    tolerations:
      - effect: NoSchedule
        key: ephemeral
        operator: Equal
        value: "true"

  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "14d"
      # Persist data using your local-path storage class
      storage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: local-path
      # Place the database on your ubuntu node
      nodeSelector:
        kubernetes.io/hostname: ubuntu
      resources:
        requests:
          memory: 512Mi
          cpu: 250m
        limits:
          memory: 2Gi
          cpu: 1000m
