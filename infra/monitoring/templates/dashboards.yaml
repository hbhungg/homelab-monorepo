# Custom Grafana dashboards, loaded by the grafana sidecar
# (any ConfigMap labeled grafana_dashboard: "1" is auto-provisioned).
# Workflow: edit in the Grafana UI -> Dashboard settings -> JSON Model ->
# copy into dashboards/<name>.json -> just deploy-infra.
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
