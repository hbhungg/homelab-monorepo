{{- $app := .Values -}}
{{- if and $app.enabled $app.cron $app.cron.enabled }}
{{- $cron := $app.cron }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  schedule: {{ required "cron.schedule is required" $cron.schedule | quote }}
  {{- with $cron.timeZone }}
  timeZone: {{ . }}
  {{- end }}
  {{- with $cron.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ . }}
  {{- end }}
  concurrencyPolicy: {{ $cron.concurrencyPolicy | default "Forbid" }}
  {{- with $cron.suspend }}
  suspend: {{ . }}
  {{- end }}
  successfulJobsHistoryLimit: {{ $cron.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $cron.failedJobsHistoryLimit | default 1 }}
  jobTemplate:
    spec:
      {{- with $cron.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      backoffLimit: {{ $cron.backoffLimit | default 6 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Release.Name }}
          {{- include "homelab.podAnnotations" (dict "app" $app) | nindent 10 }}
        spec:
          restartPolicy: {{ $cron.restartPolicy | default "OnFailure" }}
          {{- include "homelab.podSpec" (dict "key" .Release.Name "app" $app) | nindent 10 }}
{{- end }}
