{{- $app := .Values -}}
{{- if and $app.enabled $app.ingress $app.ingress.enabled }}
{{- $portName := $app.ingress.portName | default "http" }}
{{- $found := false }}
{{- range $app.ports }}
{{- if eq .name $portName }}{{- $found = true }}{{- end }}
{{- end }}
{{- if not $found }}
{{- fail (printf "%s: ingress targets container port named %q, but the app defines no such port" .Release.Name $portName) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
{{- if $app.ingress.tls }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.certManager.clusterIssuer.name }}
{{- end }}
spec:
  ingressClassName: traefik
  rules:
{{- range $app.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: {{ $app.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  name: {{ $portName }}
{{- end }}
{{- if $app.ingress.tls }}
  tls:
    - hosts:
{{- range $app.ingress.tls }}
        - {{ . }}
{{- end }}
      secretName: {{ $.Release.Name }}-tls
{{- end }}
{{- end }}
