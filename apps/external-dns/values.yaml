enabled: true
image:
  repository: coredns/coredns
  tag: "1.11.1"
replicas: 1
ports:
  - name: dns
    containerPort: 53
    protocol: UDP
  - name: dns-tcp
    containerPort: 53
    protocol: TCP
service:
  type: ClusterIP
hostNetwork: true
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ubuntu
args:
  - "-conf"
  - "/etc/coredns/Corefile"
volumeMounts:
  - name: config-volume
    mountPath: /etc/coredns
volumes:
  - name: config-volume
    configMap:
      name: external-dns
configMap:
  # CoreDNS Corefile configuration
  # The {{TRAEFIK_IP}} placeholder is replaced with the live Traefik LB IP at deploy time.
  # Set traefikIPFallback to render offline (`helm template`) or on a first install,
  # when the lookup can't resolve an IP yet:
  # traefikIPFallback: 192.168.0.x
  corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready

        # Static LAN names for LoadBalancer VIPs (MetalLB pool 192.168.0.240-250).
        # NB: template blocks are tried in order, most-specific first; a `hosts`
        # block would never fire for *.home since the wildcard template runs first.
        template IN A postgres.home {
            match ^postgres\.home\.$
            answer "{{ .Name }} 60 IN A 192.168.0.241"
        }

        # Handle *.home domains - IP dynamically looked up from traefik service
        template IN A home {
            match \.home\.$
            answer "{{ .Name }} 60 IN A {{TRAEFIK_IP}}"
            fallthrough
        }

        # Forward all other queries to upstream DNS
        forward . 8.8.8.8 8.8.4.4 {
            max_concurrent 1000
        }

        cache 30
        loop
        reload
        loadbalance
    }
