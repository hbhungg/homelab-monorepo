enabled: true
image:
  repository: registry.home/mfw
  tag: latest
  imagePullPolicy: Always
replicas: 1
ports:
  - name: http
    containerPort: 3000
    protocol: TCP
env:
  - name: PORT
    value: "3000"
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pi-1
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
ingress:
  enabled: true
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: MFW
    gethomepage.dev/group: Apps
    gethomepage.dev/description: My public site
  hosts:
    - mfw.ddns.net
  tls:
    - mfw.ddns.net
