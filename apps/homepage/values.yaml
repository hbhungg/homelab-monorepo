enabled: true
image:
  repository: ghcr.io/gethomepage/homepage
  tag: latest
replicas: 1
serviceAccountName: homepage
ports:
  - name: http
    containerPort: 3000
    protocol: TCP
# Per gethomepage.dev/installation/k8s: each file is subPath-mounted so
# /app/config stays writable (homepage copies skeleton configs in at boot;
# a whole-dir ConfigMap mount is read-only and crash-loops it).
volumeMounts:
  - mountPath: /app/config/bookmarks.yaml
    name: homepage-config
    subPath: bookmarks.yaml
  - mountPath: /app/config/custom.css
    name: homepage-config
    subPath: custom.css
  - mountPath: /app/config/custom.js
    name: homepage-config
    subPath: custom.js
  - mountPath: /app/config/docker.yaml
    name: homepage-config
    subPath: docker.yaml
  - mountPath: /app/config/kubernetes.yaml
    name: homepage-config
    subPath: kubernetes.yaml
  - mountPath: /app/config/services.yaml
    name: homepage-config
    subPath: services.yaml
  - mountPath: /app/config/settings.yaml
    name: homepage-config
    subPath: settings.yaml
  - mountPath: /app/config/widgets.yaml
    name: homepage-config
    subPath: widgets.yaml
  - mountPath: /app/config/logs
    name: logs
volumes:
  - name: homepage-config
    configMap:
      name: homepage
  - name: logs
    emptyDir: {}
env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: homepage.home
ingress:
  enabled: true
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Homepage
    gethomepage.dev/group: Apps
    gethomepage.dev/description: This dashboard
  hosts:
    - homepage.home
