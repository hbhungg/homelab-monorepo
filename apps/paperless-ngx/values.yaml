enabled: true
stateful: true
image:
  repository: ghcr.io/paperless-ngx/paperless-ngx
  # Pinned: `latest` silently jumped v2.20.15 -> v3.0.5 on 2026-08-01,
  # which changed the checksum algorithm (MD5 -> SHA-256) and wiped media
  # (see the PAPERLESS_*_ROOT fix below). Pin to avoid silent upgrades.
  tag: "3.0.5"
replicas: 1
ports:
  - name: http
    containerPort: 8000
    protocol: TCP
env:
  - name: PAPERLESS_REDIS
    value: redis://redis:6379
  - name: PAPERLESS_DBHOST
    value: postgres
  - name: PAPERLESS_DBNAME
    value: paperless
  - name: PAPERLESS_DBUSER
    value: postgres
  - name: PAPERLESS_DBPORT
    value: "5432"
  - name: PAPERLESS_URL
    value: https://paperless.home
  - name: PAPERLESS_TIME_ZONE
    value: America/Los_Angeles
  - name: PAPERLESS_OCR_LANGUAGE
    value: eng
  - name: PAPERLESS_MEDIA_ROOT
    value: /usr/src/paperless/data/media
  - name: PAPERLESS_CONSUMPTION_DIR
    value: /usr/src/paperless/data/consume
  - name: PAPERLESS_EXPORT_DIR
    value: /usr/src/paperless/data/export
  - name: PAPERLESS_AUTO_LOGIN_USERNAME
    value: admin
  - name: PAPERLESS_ADMIN_USER
    value: admin
  - name: PAPERLESS_ADMIN_PASSWORD
    value: admin
envFrom:
  - secretRef:
      name: postgres-secret
  - secretRef:
      name: paperless-secret
persistence:
  enabled: true
  size: 50Gi
  mountPath: /usr/src/paperless/data
  storageClass: local-path
  annotations:
    # K8up opt-in: with k8up.skipWithoutAnnotation=true, only PVCs carrying
    # this annotation are backed up. paperless media/docs are the bulk of our
    # restorable data.
    k8up.io/backup: "true"
resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 2Gi
    cpu: 1000m
ingress:
  enabled: true
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Paperless
    gethomepage.dev/group: Apps
    gethomepage.dev/description: Document management
  hosts:
    - paperless.home
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - ubuntu
