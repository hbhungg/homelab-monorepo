apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ray-dashboard
  namespace: compute
  labels:
    app.kubernetes.io/name: ray-dashboard
  annotations:
    gethomepage.dev/description: Ray Dashboard
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Compute
    gethomepage.dev/icon: google-compute-engine.png
    gethomepage.dev/name: Ray
    gethomepage.dev/pod-selector: "ray.io/node-type=head"
spec:
  rules:
  - host: dashboard.ray.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ray-compute-head-svc
            port:
              number: 8265
---
apiVersion: v1
kind: Service
metadata:
  name: ray-compute-head-client
  namespace: compute
spec:
  type: NodePort
  selector:
    ray.io/cluster: ray-compute
    ray.io/node-type: head
  ports:
  - port: 10001
    targetPort: 10001
    nodePort: 30001
    protocol: TCP
    name: client
