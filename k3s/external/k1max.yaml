apiVersion: v1
kind: Service
metadata:
  name: k1max
  namespace: external
spec:
  ports:
  - port: 4408
    targetPort: 4408
---
apiVersion: v1
kind: Endpoints
metadata:
  name: k1max
  namespace: external
subsets:
- addresses:
  - ip: 192.168.0.55
  ports:
  - port: 4408
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k1max
  namespace: external
spec:
  rules:
  - host: k1max.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: k1max
            port:
              number: 4408