apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: external
spec:
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: router
  namespace: external
subsets:
- addresses:
  - ip: 192.168.0.1
  ports:
  - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: router
  namespace: external
spec:
  rules:
  - host: router.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: router
            port:
              number: 80
