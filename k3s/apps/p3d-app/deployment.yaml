apiVersion: apps/v1
kind: Deployment
metadata:
  name: p3d-app
  namespace: default
  labels:
    app.kubernetes.io/name: p3d-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: p3d-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p3d-app
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - ubuntu
      containers:
      - name: p3d-app
        image: registry.home/p3d-app:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 3000
            name: http
        env:
          - name: NEXT_PUBLIC_BASE_URL
            value: "https://p3d.mfw.ddns.net/"
          - name: CLERK_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: p3d-app-secret
                key: CLERK_SECRET_KEY