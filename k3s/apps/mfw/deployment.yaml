apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfw-srv
  namespace: default
  labels:
    app.kubernetes.io/name: mfw-srv
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mfw-srv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mfw-srv
    spec:
      containers:
      - name: mfw-srv
        image: registry.home/mfw-srv:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 3000
            name: http