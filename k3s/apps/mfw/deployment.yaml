apiVersion: apps/v1
kind: Deployment
metadata:
  name: mfw-srv
  namespace: default
  labels:
    app.kubernetes.io/name: mfw-srv
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mfw-srv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mfw-srv
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - pi-1
      containers:
      - name: mfw-srv
        image: registry.home/mfw-srv:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
          - containerPort: 3000
            name: http