apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: registry
  namespace: infrastructure
  labels:
    app.kubernetes.io/name: registry
spec:
  rules:
    - host: "registry.home"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  number: 5000