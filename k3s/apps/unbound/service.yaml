apiVersion: v1
kind: Service
metadata:
  name: unbound
  namespace: infrastructure
  annotations:
    "node-selector": "app=unbound"
spec:
  type: LoadBalancer
  # loadBalancerIP: 192.168.0.2
  externalTrafficPolicy: Local
  ports:
  - port: 53
    targetPort: 53
    protocol: UDP
    name: dns-udp
  - port: 53
    targetPort: 53
    protocol: TCP
    name: dns-tcp
  selector:
    app: unbound