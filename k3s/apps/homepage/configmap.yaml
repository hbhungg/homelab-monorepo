# apps/homepage/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: default
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Home Page
    theme: dark
    color: neutral
    showStats: false

  custom.css: ""
  custom.js: ""
  bookmarks.yaml: ""
  services.yaml: |
    - External:
        - Router:
            icon: router.png
            href: http://router.home
            description: Network Router
        - Fluidd:
            icon: fluidd.png
            href: http://k1max.home
            description: K1 Max 3D Printer
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
        nodes:
          show: true
          cpu: true
          memory: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""