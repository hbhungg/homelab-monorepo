# Install k3s from scratch (or join a new worker to the cluster).
# Only needed when (re)provisioning a node — day-to-day you don't run this.
#
#   just k3s-install              # all nodes missing k3s
#   just k3s-install pi-1         # a single new worker
#
# After the server install, the kubeconfig lands at
# /etc/rancher/k3s/k3s.yaml on the control plane node.
- name: Install k3s control plane
  hosts: k3s_server
  tasks:
    - name: Check if k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_bin

    - name: Install k3s server
      ansible.builtin.shell: >-
        curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s
      when: not k3s_bin.stat.exists

- name: Install k3s workers
  hosts: k3s_agent
  tasks:
    - name: Check if k3s-agent is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-agent
      register: k3s_agent_bin

    - name: Fetch node token from control plane
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token
      delegate_to: "{{ groups['k3s_server'][0] }}"
      when: not k3s_agent_bin.stat.exists

    - name: Install k3s agent
      ansible.builtin.shell: >-
        curl -sfL https://get.k3s.io |
        K3S_URL=https://{{ hostvars[groups['k3s_server'][0]].ansible_host }}:6443
        K3S_TOKEN={{ node_token.content | b64decode | trim }}
        sh -
      when: not k3s_agent_bin.stat.exists
