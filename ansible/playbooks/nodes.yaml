# Converge node-level config on all k3s nodes.
# Replaces k3s-config/setup-node.sh (registries.yaml + /etc/hosts entries)
# and handles common OS config. Safe to re-run (idempotent).
#
#   just nodes            # all nodes
#   just nodes pi-1       # one node
- name: Configure k3s nodes
  hosts: all
  # Self-contained privilege escalation: `just nodes` runs from the repo root,
  # where ansible/ansible.cfg is not picked up automatically.
  become: true
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - vim
          - htop
          - iotop
        state: present
        update_cache: true

    - name: Ensure /etc/rancher/k3s exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Install k3s registries.yaml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/registries.yaml"
        dest: /etc/rancher/k3s/registries.yaml
        mode: "0644"
      notify: Restart k3s

    # cloud-init ships `manage_etc_hosts: True`, which regenerates /etc/hosts
    # from /etc/cloud/templates/hosts.debian.tmpl on every boot. That silently
    # deleted the registry.home entry below, and containerd image pulls from the
    # in-cluster registry then failed with `lookup registry.home: no such host`
    # (most visibly after a Pi reboot). Opt out so the entry survives reboots.
    - name: Check for cloud-init
      ansible.builtin.stat:
        path: /etc/cloud
      register: cloud_init_dir

    - name: Disable cloud-init /etc/hosts management
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-homelab-manage-etc-hosts.cfg
        content: |
          # Managed by ansible/playbooks/nodes.yaml -- do not edit by hand.
          # Stop cloud-init regenerating /etc/hosts on boot: it wipes
          # hand-managed entries such as `registry.home`, which breaks image
          # pulls from the in-cluster registry after a node reboot.
          manage_etc_hosts: false
        mode: "0644"
      when: cloud_init_dir.stat.exists

    # registry.home must resolve to Traefik's MetalLB VIP (192.168.0.240), not
    # to a node IP: nothing serves the registry on the nodes themselves, and
    # requests are routed by the traefik ingress Host header.
    # NB: that VIP is auto-assigned from the MetalLB pool (infra/metallb), so if
    # traefik ever lands on a different address, update this line too.
    - name: Add /etc/hosts entry for registry.home
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "192.168.0.240 registry.home"
        regexp: '^\S+\s+registry\.home'
        state: present
      notify: Restart k3s

  handlers:
    - name: Restart k3s
      ansible.builtin.service:
        name: "{{ 'k3s' if inventory_hostname in groups['k3s_server'] else 'k3s-agent' }}"
        state: restarted
