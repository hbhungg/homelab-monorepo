# Ansible inventory for the k3s cluster nodes.
# Assumes SSH key auth is already set up (ssh wren@<ip> works).
all:
  children:
    k3s_server: # control plane
      hosts:
        ubuntu:
          ansible_host: 192.168.0.201
          ansible_user: chonky
    k3s_agent: # workers
      hosts:
        pi-1:
          ansible_host: 192.168.0.200
          ansible_user: ubuntu
  vars:
    ansible_python_interpreter: /usr/bin/python3
