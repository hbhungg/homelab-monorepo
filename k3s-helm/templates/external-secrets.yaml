{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden
spec:
  provider:
    bitwardensecretsmanager:
      apiURL: {{ $es.apiURL }}
      identityURL: {{ $es.identityURL }}
      bitwardenServerSDKURL: https://bitwarden-sdk-server.{{ .Release.Namespace }}.svc.cluster.local:9998
      caProvider:
        type: Secret
        name: bitwarden-tls-certs
        key: ca.crt
        namespace: {{ .Release.Namespace }}
      organizationID: {{ required "externalSecrets.organizationID is required — find it in the Bitwarden web vault URL" $es.organizationID }}
      projectID: {{ required "externalSecrets.projectID is required — the Secrets Manager project holding the homelab secrets" $es.projectID }}
      auth:
        secretRef:
          credentials:
            name: {{ $es.tokenSecretName }}
            key: token
            namespace: {{ .Release.Namespace }}
{{- range $name, $keys := $es.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
{{- range $k8sKey, $bwName := $keys }}
    - secretKey: {{ $k8sKey }}
      remoteRef:
        key: {{ $bwName }}
{{- end }}
{{- end }}
{{- end }}
