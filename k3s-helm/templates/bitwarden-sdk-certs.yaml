{{- /*
The bitwarden-sdk-server (ESO's bridge to Bitwarden Secrets Manager) refuses
to run over plain HTTP. These issue it an in-cluster self-signed cert; the
ClusterSecretStore trusts it via the ca.crt in the same secret.
The secret name "bitwarden-tls-certs" is what the sdk-server chart mounts by default.
*/}}
{{- if and (index .Values "external-secrets").enabled (index (index .Values "external-secrets") "bitwarden-sdk-server").enabled }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bitwarden-bootstrap-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-bootstrap-ca
spec:
  isCA: true
  commonName: bitwarden-bootstrap-ca
  secretName: bitwarden-bootstrap-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: bitwarden-bootstrap-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bitwarden-ca-issuer
spec:
  ca:
    secretName: bitwarden-bootstrap-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bitwarden-tls-certs
spec:
  secretName: bitwarden-tls-certs
  dnsNames:
    - bitwarden-sdk-server
    - bitwarden-sdk-server.{{ .Release.Namespace }}.svc
    - bitwarden-sdk-server.{{ .Release.Namespace }}.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
    - ::1
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  issuerRef:
    name: bitwarden-ca-issuer
    kind: Issuer
    group: cert-manager.io
{{- end }}
