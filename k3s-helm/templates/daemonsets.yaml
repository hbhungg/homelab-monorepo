{{- range $key, $app := .Values.apps }}
{{- if and $app.enabled $app.daemonset }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $key }}
  labels:
    app.kubernetes.io/name: {{ $key }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $key }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $key }}
    spec:
{{- if $app.hostNetwork }}
      hostNetwork: {{ $app.hostNetwork }}
{{- end }}
{{- if $app.hostPID }}
      hostPID: {{ $app.hostPID }}
{{- end }}
{{- if $app.tolerations }}
      tolerations:
{{ toYaml $app.tolerations | indent 8 }}
{{- end }}
      containers:
        - name: {{ $key }}
          image: "{{ $app.image.repository }}:{{ $app.image.tag }}"
{{- if $app.args }}
          args:
{{- range $app.args }}
            - {{ . | quote }}
{{- end }}
{{- end }}
{{- if $app.resources }}
          resources:
{{ toYaml $app.resources | indent 12 }}
{{- end }}
{{- if $app.ports }}
          ports:
{{- range $app.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
{{- if .hostPort }}
              hostPort: {{ .hostPort }}
{{- end }}
              protocol: {{ .protocol | default "TCP" }}
{{- end }}
{{- end }}
{{- if $app.volumeMounts }}
          volumeMounts:
{{- range $app.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
{{- if .readOnly }}
              readOnly: {{ .readOnly }}
{{- end }}
{{- if .mountPropagation }}
              mountPropagation: {{ .mountPropagation }}
{{- end }}
{{- end }}
{{- end }}
{{- if $app.volumes }}
      volumes:
{{- range $app.volumes }}
        - name: {{ .name }}
{{- if .hostPath }}
          hostPath:
            path: {{ .hostPath.path }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
