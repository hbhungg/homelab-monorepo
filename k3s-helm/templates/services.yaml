{{- range $key, $app := .Values.apps }}
{{- if and $app.enabled $app.ports }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $key }}
  labels:
    app.kubernetes.io/name: {{ $key }}
spec:
{{- if $app.stateful }}
  clusterIP: None
{{- else }}
  type: ClusterIP
{{- end }}
  ports:
{{- range $app.ports }}
    - port: {{ .containerPort }}
      targetPort: {{ .containerPort }}
      protocol: {{ .protocol | default "TCP" }}
      name: {{ .name }}
{{- end }}
  selector:
    app.kubernetes.io/name: {{ $key }}
{{- end }}
{{- end }}