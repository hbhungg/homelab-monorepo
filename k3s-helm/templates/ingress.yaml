{{- range $key, $app := .Values.apps }}
{{- if and $app.enabled $app.ingress $app.ingress.enabled }}
{{- $portName := $app.ingress.portName | default "http" }}
{{- $found := false }}
{{- range $app.ports }}
{{- if eq .name $portName }}{{- $found = true }}{{- end }}
{{- end }}
{{- if not $found }}
{{- fail (printf "%s: ingress targets container port named %q, but the app defines no such port" $key $portName) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $key }}
{{- if $app.ingress.tls }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.certManager.clusterIssuer.name }}
{{- end }}
spec:
  ingressClassName: traefik
  rules:
{{- range $app.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: {{ $app.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $key }}
                port:
                  name: {{ $portName }}
{{- end }}
{{- if $app.ingress.tls }}
  tls:
    - hosts:
{{- range $app.ingress.tls }}
        - {{ . }}
{{- end }}
      secretName: {{ $key }}-tls
{{- end }}
{{- end }}
{{- end }}
{{- range $key, $svc := .Values.externalServices }}
{{- if and $svc.enabled $svc.ingress $svc.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $key }}
  namespace: {{ $svc.namespace | default "default" }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ $svc.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $key }}
                port:
                  number: {{ (index $svc.ports 0).port }}
{{- end }}
{{- end }}
