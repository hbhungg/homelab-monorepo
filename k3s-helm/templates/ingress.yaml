{{- range $key, $app := .Values.apps }}
{{- if and $app.enabled $app.ingress $app.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $key }}
{{- if $app.ingress.tls }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
{{- end }}
spec:
  ingressClassName: traefik
  rules:
{{- if $app.ingress.hosts }}
{{- range $app.ingress.hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $key }}
                port:
                  name: http
{{- end }}
{{- else }}
    - host: {{ $app.ingress.host }}
      http:
        paths:
          - path: {{ $app.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ $key }}
                port:
                  name: http
{{- end }}
{{- if $app.ingress.tls }}
  tls:
    - hosts:
{{- range $app.ingress.tls }}
        - {{ . }}
{{- end }}
      secretName: {{ $key }}-tls
{{- end }}
{{- end }}
{{- end }}
{{- range $key, $svc := .Values.externalServices }}
{{- if and $svc.enabled $svc.ingress $svc.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $key }}
  namespace: {{ $svc.namespace | default "default" }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ $svc.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $key }}
                port:
                  number: {{ (index $svc.ports 0).port }}
{{- end }}
{{- end }}