{{- range $key, $app := .Values.apps }}
{{- if and $app.enabled $app.stateful }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $key }}
  labels:
    app.kubernetes.io/name: {{ $key }}
spec:
  serviceName: {{ $key }}
  replicas: {{ $app.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $key }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $key }}
      {{- include "homelab.podAnnotations" (dict "app" $app) | nindent 6 }}
    spec:
      {{- include "homelab.podSpec" (dict "key" $key "app" $app) | nindent 6 }}
{{- if and $app.persistence $app.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ $app.persistence.storageClass | default "local-path" }}
        resources:
          requests:
            storage: {{ $app.persistence.size }}
{{- end }}
{{- end }}
{{- end }}
