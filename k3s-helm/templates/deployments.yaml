{{- range $key, $app := .Values.apps }}
{{- if and $app.enabled (not $app.stateful) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $key }}
  labels:
    app.kubernetes.io/name: {{ $key }}
spec:
  replicas: {{ $app.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $key }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $key }}
    spec:
{{- if $app.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
{{- end }}
{{- if $app.serviceAccountName }}
      serviceAccountName: {{ $app.serviceAccountName }}
{{- end }}
{{- if $app.affinity }}
      affinity:
{{ toYaml $app.affinity | indent 8 }}
{{- end }}
      containers:
        - name: {{ $key }}
          image: "{{ $app.image.repository }}:{{ $app.image.tag }}"
{{- if $app.args }}
          args:
{{- range $app.args }}
            - {{ . | quote }}
{{- end }}
{{- end }}
{{- if $app.resources }}
          resources:
{{ toYaml $app.resources | indent 12 }}
{{- end }}
{{- if $app.ports }}
          ports:
{{- range $app.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol | default "TCP" }}
{{- end }}
{{- end }}
{{- if $app.env }}
          env:
{{- range $app.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
{{- end }}
{{- end }}
{{- if $app.envFrom }}
          envFrom:
{{- range $app.envFrom }}
            - secretRef:
                name: {{ .secretRef.name }}
{{- end }}
{{- end }}
{{- if $app.securityContext }}
          securityContext:
{{ toYaml $app.securityContext | indent 12 }}
{{- end }}
{{- if or $app.volumeMounts $app.persistence }}
          volumeMounts:
{{- if $app.volumeMounts }}
{{- range $app.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
{{- if .subPath }}
              subPath: {{ .subPath }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $app.persistence $app.persistence.enabled }}
            - name: data
              mountPath: {{ $app.persistence.mountPath }}
{{- end }}
{{- end }}
{{- if or $app.volumes $app.persistence }}
      volumes:
{{- if $app.volumes }}
{{- range $app.volumes }}
        - name: {{ .name }}
{{- if .emptyDir }}
          emptyDir: {}
{{- else if .configMap }}
          configMap:
            name: {{ .configMap.name }}
{{- end }}
{{- end }}
{{- end }}
{{- if and $app.persistence $app.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $key }}-data
{{- end }}
{{- end }}
{{- end }}
{{- end }}