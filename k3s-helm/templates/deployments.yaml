{{- range $key, $app := .Values.apps }}
{{- if and $app.enabled (not $app.stateful) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $key }}
  labels:
    app.kubernetes.io/name: {{ $key }}
spec:
  replicas: {{ $app.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $key }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $key }}
      {{- include "homelab.podAnnotations" (dict "app" $app) | nindent 6 }}
    spec:
      {{- include "homelab.podSpec" (dict "key" $key "app" $app) | nindent 6 }}
{{- end }}
{{- end }}
