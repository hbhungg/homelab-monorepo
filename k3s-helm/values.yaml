# Apps configuration
apps:
  homepage:
    enabled: true
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: latest
    replicas: 1
    serviceAccountName: homepage
    ports:
      - name: http
        containerPort: 3000
        protocol: TCP
    volumeMounts:
      - mountPath: /app/config/custom.js
        name: homepage-config
        subPath: custom.js
      - mountPath: /app/config/logs
        name: logs
    volumes:
      - name: homepage-config
        configMap:
          name: homepage
      - name: logs
        emptyDir: {}
    env:
      - name: HOMEPAGE_ALLOWED_HOSTS
        value: homepage.home
    ingress:
      enabled: true
      host: homepage.home

  mfw:
    enabled: true
    image:
      repository: registry.home/mfw-srv
      tag: latest
    replicas: 1
    ports:
      - name: http
        containerPort: 3000
        protocol: TCP
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - pi-1
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    ingress:
      enabled: true
      hosts:
        - mfw.ddns.net
      tls:
        - mfw.ddns.net

  registry:
    enabled: true
    image:
      repository: registry
      tag: "2"
    replicas: 1
    ports:
      - name: http
        containerPort: 5000
        protocol: TCP
    persistence:
      enabled: true
      size: 100Gi
      mountPath: /var/lib/registry
      storageClass: local-path
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ubuntu
    ingress:
      enabled: true
      host: registry.home

  noip:
    enabled: true
    image:
      repository: ghcr.io/noipcom/noip-duc
      tag: latest
    replicas: 1
    envFrom:
      - secretRef:
          name: noip-secret

  postgres:
    enabled: true
    stateful: true
    image:
      repository: postgres
      tag: 17-alpine
    replicas: 1
    ports:
      - name: postgres
        containerPort: 5432
        protocol: TCP
    env:
      - name: POSTGRES_PASSWORD
        value: changeme
      - name: POSTGRES_DB
        value: homelab
      - name: POSTGRES_USER
        value: postgres
    persistence:
      enabled: true
      size: 20Gi
      mountPath: /var/lib/postgresql/data
      storageClass: local-path
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ubuntu

  redis:
    enabled: true
    stateful: true
    image:
      repository: redis
      tag: 7-alpine
    replicas: 1
    ports:
      - name: redis
        containerPort: 6379
        protocol: TCP
    persistence:
      enabled: true
      size: 8Gi
      mountPath: /data
      storageClass: local-path
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ubuntu

  external-dns:
    enabled: true
    image:
      repository: coredns/coredns
      tag: "1.11.1"
    replicas: 2
    ports:
      - name: dns
        containerPort: 53
        protocol: UDP
      - name: dns-tcp
        containerPort: 53
        protocol: TCP
    service:
      type: NodePort
      nodePort: 30053
    args:
      - "-conf"
      - "/etc/coredns/Corefile"
    volumeMounts:
      - name: config-volume
        mountPath: /etc/coredns
    volumes:
      - name: config-volume
        configMap:
          name: external-dns
    configMap:
      # CoreDNS Corefile configuration
      # The {{TRAEFIK_IP}} placeholder will be replaced with the actual Traefik IP during deployment
      corefile: |
        .:53 {
            errors
            health {
                lameduck 5s
            }
            ready
            
            # Handle *.homedev domains - IP dynamically looked up from traefik service
            template IN A homedev {
                match \.homedev\.$
                answer "{{ .Name }} 60 IN A {{TRAEFIK_IP}}"
                fallthrough
            }
            
            # Forward all other queries to upstream DNS
            forward . 8.8.8.8 8.8.4.4 {
                max_concurrent 1000
            }
            
            cache 30
            loop
            reload
            loadbalance
        }

  node-exporter:
    enabled: true
    daemonset: true
    image:
      repository: prom/node-exporter
      tag: "v1.8.2"
    ports:
      - name: metrics
        containerPort: 9100
        hostPort: 9100
        protocol: TCP
    args:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumeMounts:
      - name: proc
        mountPath: /host/proc
        readOnly: true
      - name: sys
        mountPath: /host/sys
        readOnly: true
      - name: root
        mountPath: /host/root
        mountPropagation: HostToContainer
        readOnly: true
    volumes:
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      - name: root
        hostPath:
          path: /
    hostNetwork: true
    hostPID: true
    tolerations:
      - effect: NoSchedule
        key: ephemeral
        operator: Equal
        value: "true"

  victoriametrics:
    enabled: true
    stateful: true
    image:
      repository: victoriametrics/victoria-metrics
      tag: "v1.113.0"
    replicas: 1
    ports:
      - name: http
        containerPort: 8428
        protocol: TCP
    args:
      - "-storageDataPath=/victoria-metrics-data"
      - "-retentionPeriod=14d"
      - "-selfScrapeInterval=10s"
      - "-search.maxQueryDuration=60s"
      - "-promscrape.config=/etc/vm-scrape-config/scrape.yml"
    persistence:
      enabled: true
      size: 50Gi
      mountPath: /victoria-metrics-data
      storageClass: local-path
    volumeMounts:
      - name: scrape-config
        mountPath: /etc/vm-scrape-config
    volumes:
      - name: scrape-config
        configMap:
          name: victoriametrics-scrape-config
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ubuntu
    ingress:
      enabled: true
      host: metrics.homedev
    scrapeConfig:
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: 'victoriametrics'
          static_configs:
            - targets: ['localhost:8428']
        - job_name: 'node-exporter'
          kubernetes_sd_configs:
            - role: node
          relabel_configs:
            - source_labels: [__address__]
              regex: '([^:]+)(?::\d+)?'
              replacement: '$1:9100'
              target_label: __address__
            - source_labels: [__meta_kubernetes_node_name]
              target_label: node

# Metrics Server (for kubectl top and k9s CPU/MEM stats)
metrics-server:
  enabled: true
  args:
    - --kubelet-insecure-tls
    - --kubelet-preferred-address-types=InternalIP

# Cert-manager (for TLS certificates from Let's Encrypt)
cert-manager:
  enabled: true
  installCRDs: true
  namespace: cert-manager
  fullnameOverride: cert-manager

# Cert-manager ClusterIssuer configuration
certManager:
  clusterIssuer:
    enabled: true
    name: letsencrypt-prod
    email: hung.ba.huynh@proton.me
    server: https://acme-v02.api.letsencrypt.org/directory

# External services (services pointing to external IPs)
externalServices:
  k1max:
    enabled: true
    namespace: external
    externalIP: 192.168.0.55
    ports:
      - port: 4408
    ingress:
      enabled: true
      host: k1max.home

  router:
    enabled: true
    namespace: external
    externalIP: 192.168.0.1
    ports:
      - port: 80
    ingress:
      enabled: true
      host: router.home

# Namespaces to create
namespaces:
  - name: external