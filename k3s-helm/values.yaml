# Apps configuration
apps:
  homepage:
    enabled: true
    image:
      repository: ghcr.io/gethomepage/homepage
      tag: latest
    replicas: 1
    serviceAccountName: homepage
    ports:
      - name: http
        containerPort: 3000
        protocol: TCP
    volumeMounts:
      - mountPath: /app/config/custom.js
        name: homepage-config
        subPath: custom.js
      - mountPath: /app/config/logs
        name: logs
    volumes:
      - name: homepage-config
        configMap:
          name: homepage
      - name: logs
        emptyDir: {}
    env:
      - name: HOMEPAGE_ALLOWED_HOSTS
        value: homepage.home
    ingress:
      enabled: true
      hosts:
        - homepage.home

  mfw:
    enabled: true
    image:
      repository: registry.home/mfw
      tag: latest
      imagePullPolicy: Always
    replicas: 1
    ports:
      - name: http
        containerPort: 3000
        protocol: TCP
    env:
      - name: PORT
        value: "3000"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - pi-1
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    ingress:
      enabled: true
      hosts:
        - mfw.ddns.net
      tls:
        - mfw.ddns.net

  registry:
    enabled: true
    stateful: true
    image:
      repository: registry
      tag: "2"
    replicas: 1
    ports:
      - name: http
        containerPort: 5000
        protocol: TCP
    persistence:
      enabled: true
      size: 100Gi
      mountPath: /var/lib/registry
      storageClass: local-path
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ubuntu
    ingress:
      enabled: true
      hosts:
        - registry.home

  noip:
    enabled: true
    image:
      repository: ghcr.io/noipcom/noip-duc
      tag: latest
    replicas: 1
    envFrom:
      - secretRef:
          name: noip-secret

  postgres:
    enabled: true
    stateful: true
    image:
      repository: postgres
      tag: 17-alpine
    replicas: 1
    ports:
      - name: postgres
        containerPort: 5432
        protocol: TCP
    envFrom:
      - secretRef:
          name: postgres-secret
    persistence:
      enabled: true
      size: 20Gi
      mountPath: /var/lib/postgresql/data
      storageClass: local-path
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 512Mi
        cpu: 500m
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ubuntu

  redis:
    enabled: true
    stateful: true
    image:
      repository: redis
      tag: 7-alpine
    replicas: 1
    ports:
      - name: redis
        containerPort: 6379
        protocol: TCP
    persistence:
      enabled: true
      size: 8Gi
      mountPath: /data
      storageClass: local-path
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ubuntu

  external-dns:
    enabled: true
    image:
      repository: coredns/coredns
      tag: "1.11.1"
    replicas: 1
    ports:
      - name: dns
        containerPort: 53
        protocol: UDP
      - name: dns-tcp
        containerPort: 53
        protocol: TCP
    service:
      type: ClusterIP
    hostNetwork: true
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ubuntu
    args:
      - "-conf"
      - "/etc/coredns/Corefile"
    volumeMounts:
      - name: config-volume
        mountPath: /etc/coredns
    volumes:
      - name: config-volume
        configMap:
          name: external-dns
    configMap:
      # CoreDNS Corefile configuration
      # The {{TRAEFIK_IP}} placeholder is replaced with the live Traefik LB IP at deploy time.
      # Set traefikIPFallback to render offline (`helm template`) or on a first install,
      # when the lookup can't resolve an IP yet:
      # traefikIPFallback: 192.168.0.x
      corefile: |
        .:53 {
            errors
            health {
                lameduck 5s
            }
            ready
            
            # Handle *.home domains - IP dynamically looked up from traefik service
            template IN A home {
                match \.home\.$
                answer "{{ .Name }} 60 IN A {{TRAEFIK_IP}}"
                fallthrough
            }
            
            # Forward all other queries to upstream DNS
            forward . 8.8.8.8 8.8.4.4 {
                max_concurrent 1000
            }
            
            cache 30
            loop
            reload
            loadbalance
        }

  wg-easy:
    enabled: true
    image:
      repository: ghcr.io/wg-easy/wg-easy
      tag: latest
    replicas: 1
    ports:
      - name: wg
        containerPort: 30000
        servicePort: 30000
        nodePort: 30000
        protocol: UDP
      - name: http
        containerPort: 51821
        servicePort: 51821
        protocol: TCP
    env:
      - name: WG_HOST
        value: vpn.mfw.ddns.net
      - name: WG_PORT
        value: "30000"
      - name: WG_DEFAULT_DNS
        value: 192.168.0.201
      - name: WG_MTU
        value: "1280"
    securityContext:
      capabilities:
        add:
          - NET_ADMIN
          - SYS_MODULE
    persistence:
      enabled: true
      size: 256Mi
      mountPath: /etc/wireguard
    service:
      type: NodePort
    ingress:
      enabled: true
      hosts:
        - wg.home
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ubuntu
    
  
  paperless-ngx:
    enabled: true
    stateful: true
    image:
      repository: ghcr.io/paperless-ngx/paperless-ngx
      tag: latest
    replicas: 1
    ports:
      - name: http
        containerPort: 8000
        protocol: TCP
    env:
      - name: PAPERLESS_REDIS
        value: redis://redis:6379
      - name: PAPERLESS_DBHOST
        value: postgres
      - name: PAPERLESS_DBNAME
        value: paperless
      - name: PAPERLESS_DBUSER
        value: postgres
      - name: PAPERLESS_DBPORT
        value: "5432"
      - name: PAPERLESS_URL
        value: https://paperless.home
      - name: PAPERLESS_TIME_ZONE
        value: America/Los_Angeles
      - name: PAPERLESS_OCR_LANGUAGE
        value: eng
      - name: PAPERLESS_AUTO_LOGIN_USERNAME
        value: admin
      - name: PAPERLESS_ADMIN_USER
        value: admin
      - name: PAPERLESS_ADMIN_PASSWORD
        value: admin
    envFrom:
      - secretRef:
          name: postgres-secret
      - secretRef:
          name: paperless-secret
    persistence:
      enabled: true
      size: 50Gi
      mountPath: /usr/src/paperless/data
      storageClass: local-path
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
    ingress:
      enabled: true
      hosts:
        - paperless.home
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - ubuntu


# Metrics Server (for kubectl top and k9s CPU/MEM stats)
metrics-server:
  enabled: true
  args:
    - --kubelet-insecure-tls
    - --kubelet-preferred-address-types=InternalIP

# Monitoring
victoria-metrics-k8s-stack:
  enabled: true

  # Disable
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  
  # Required for k3s: Allow scraping self-signed kubelet & cAdvisor certs 
  kubelet:
    enabled: true
    serviceMonitor:
      kubelet:
        insecureSkipVerify: true
      cAdvisor:
        insecureSkipVerify: true
      probes:
        insecureSkipVerify: true
  
  # Disable alert
  alertmanager:
    enabled: false
  vmalert:
    enabled: false
  
  # Grafana
  grafana:
    enabled: true
    grafana.ini:
      auth.anonymous:
        enabled: true
        org_role: Admin
    ingress:
      enabled: true
      hosts:
        - metrics.home
  
  prometheus-node-exporter:
    tolerations:
      - effect: NoSchedule
        key: ephemeral
        operator: Equal
        value: "true"
  
  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "14d"
      # Persist data using your local-path storage class
      storage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: local-path
      # Place the database on your ubuntu node
      nodeSelector:
        kubernetes.io/hostname: ubuntu
      resources:
        requests:
          memory: 512Mi
          cpu: 250m
        limits:
          memory: 2Gi
          cpu: 1000m


# Cert-manager (for TLS certificates from Let's Encrypt)
cert-manager:
  enabled: true
  installCRDs: true
  namespace: cert-manager
  fullnameOverride: cert-manager

# Cert-manager ClusterIssuer configuration
certManager:
  clusterIssuer:
    enabled: true
    name: letsencrypt-prod
    email: hung.ba.huynh@proton.me
    server: https://acme-v02.api.letsencrypt.org/directory

# External services (services pointing to external IPs)
externalServices:
  k1max:
    enabled: true
    namespace: external
    externalIP: 192.168.0.86
    ports:
      - port: 4408
    ingress:
      enabled: true
      host: k1max.home

  snapmaker:
    enabled: true
    namespace: external
    externalIP: 192.168.0.68
    ports:
      - port: 80
    ingress:
      enabled: true
      host: snapmaker.home

  router:
    enabled: true
    namespace: external
    externalIP: 192.168.0.1
    ports:
      - port: 80
    ingress:
      enabled: true
      host: router.home

# Namespaces to create
namespaces:
  - name: external
